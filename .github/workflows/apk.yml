name: apk

# An installable Android APK on every push to main (and on demand).
#
# Two ways to get it:
#   * the run's "locus-apk" artifact (Actions tab -> the run -> Artifacts), and
#   * a rolling pre-release called `latest`, replaced on every successful build,
#     so the newest APK is always one stable link:
#     https://github.com/<owner>/<repo>/releases/tag/latest
#
# SIGNING. Android refuses to install an APK over an older one signed with a
# different key, so for updates in place the key must be the same every build.
# Set these four repo secrets once (Settings -> Secrets and variables ->
# Actions) and every build is signed with your permanent key:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64 (base64 -w0 locus-release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the build still succeeds but falls back to the throwaway debug
# key (android/app/build.gradle.kts), so each build must be uninstalled before
# the next is installed. Keep the .jks backed up: lose it and nobody can update
# an installed copy.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'art_src/**'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to replace the rolling `latest` pre-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Same pinned toolchain as test.yml: the repo does not build on newer
      # Flutter yet (see the note there).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # Both URLs are optional: the app is fully local without them.
      - name: Write .env
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env

      - name: Restore the signing keystore, when the secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the repo's release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key, so this APK cannot be installed over a previous build."
          fi

      - run: flutter pub get

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Name the APK after the commit
        id: name
        run: |
          mkdir -p dist
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          apk="dist/locus-${ver%%+*}-${GITHUB_SHA::7}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: locus-apk
          path: ${{ steps.name.outputs.apk }}
          retention-days: 30

      # Replace the rolling pre-release so `latest` is always the newest build.
      - name: Update the rolling `latest` release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.name.outputs.apk }}
          # Through the environment, never interpolated into the script: a
          # commit message is untrusted text.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}. Replaced on every push to main."
